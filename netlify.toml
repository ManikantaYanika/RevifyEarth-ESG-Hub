# Netlify deployment for the RevifyEarth frontend.
#
# Exists because the site served Netlify's 404 at the root while the deploy itself
# succeeded: the publish directory pointed one level above the build output, so `/`
# resolved to a folder containing only `public/` and the real page sat at
# `/public/index.html`. Pinning the path here keeps it version-controlled so it
# cannot drift from `build.outDir` again.
#
# Deliberately minimal. Every key below is one that was verified to be needed; no
# `base` is set, because the previous publish value was repo-root-relative, which
# means the site has no base directory configured and adding one would re-root the
# publish path rather than fix it.

[build]
  # Runs from the repo root so pnpm workspace links resolve. Only the frontend is
  # built — the API server and mockup sandbox are not part of this deployment.
  command = "pnpm --filter @workspace/revifyearth build"

  # MUST match `build.outDir` in artifacts/revifyearth/vite.config.ts.
  # That path is `dist/public`, not `dist`, because the Replit artifact manifest
  # (artifacts/revifyearth/.replit-artifact/artifact.toml) declares
  # `publicDir = "artifacts/revifyearth/dist/public"`. Flattening the Vite output
  # would fix Netlify and break Replit, so the publish path moves instead.
  publish = "artifacts/revifyearth/dist/public"

[build.environment]
  # Vite 7 requires "^20.19.0 || >=22.12.0" and the config uses `import.meta.dirname`
  # (Node >= 20.11). 22 is the lowest LTS that satisfies both and is present on every
  # current Netlify build image. Nothing in the frontend needs anything newer.
  NODE_VERSION = "22"

  # Every build-time module — vite, @vitejs/plugin-react, @tailwindcss/vite and the
  # Replit error overlay — lives in devDependencies. If NODE_ENV=production is set in
  # the site's environment, pnpm prunes them at install and the build dies at config
  # load with "Cannot find module 'vite'". This forces them in regardless.
  PNPM_FLAGS = "--prod=false"

# --- Redirects, in order. Netlify applies the first rule that matches. ------------

# No API server is deployed alongside this site, so /api must fail rather than be
# swallowed by the SPA fallback below. Without this it would answer 200 with the
# HTML shell, the assistant's status probe would see `response.ok === true`, and the
# failure would surface later as a JSON parse error instead. A 404 makes the probe
# fail deliberately, which hides the chat launcher rather than offering a broken one.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

# Build output (hashed JS/CSS chunks and images) must never fall through to the SPA
# shell. Existing files are served first, so this only matches a name that is not in
# the current deploy — typically a chunk requested by a tab still running the
# previous build. Answering 200 with index.html made that a MIME-type failure; a 404
# is the honest answer, and the app reloads once on it (see src/main.tsx).
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# SPA fallback. The site routes client-side with wouter, so a deep link or a refresh
# on /services/report-design must return index.html rather than 404. Netlify serves
# real files first, so this only catches paths with no matching asset.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
